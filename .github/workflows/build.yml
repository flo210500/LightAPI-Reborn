name: Build LightAPI-Reborn

on:
  push:
    branches: ["5.0"]
  pull_request:
    branches: ["5.0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 for BuildTools
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Spigot 26.1 via BuildTools
        uses: SpraxDev/Action-SpigotMC@v5
        with:
          versions: 26.1
          generateSrc: false
          remapped: false

      - name: Set up Java 8 for legacy NMS modules
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build legacy NMS modules with Java 8
        run: mvn -B install -pl common,nms/v1_14_R1,nms/v1_15_R1,nms/v1_16_R1,nms/v1_17_R1,nms/v1.18_R1 -am -DskipTests

      - name: Set up Java 21 for v26_1_R1 and plugin
        uses: actio
