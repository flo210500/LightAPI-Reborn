name: Build LightAPI-Reborn

on:
  push:
    branches: ["5.0"]
  pull_request:
    branches: ["5.0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Spigot 26.1 via BuildTools (needs Java 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run BuildTools for Spigot 26.1
        uses: SpraxDev/Action-SpigotMC@v5
        with:
          versions: 26.1
          generateSrc: false
          remapped: false

      - name: Set up Java 8 for legacy NMS modules
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build legacy NMS modules with Java 8
        run: mvn -B install -pl common,nms/v1_14_R1,nms/v1_15_R1,nms/v1_16_R1,nms/v1_17_R1,nms/v1.18_R1 -am -DskipTests

      - name: Set up Java 21 for v26_1_R1 and plugin
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build v26_1_R1 and plugin with Java 21
        run: mvn -B package -pl nms/v26_1_R1,plugin -am -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LightAPI-Reborn-jar
          path: plugin/target/*.jar
          if-no-files-found: warn
