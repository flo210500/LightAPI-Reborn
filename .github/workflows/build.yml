name: Build LightAPI-Reborn

on:
  push:
    branches: ["5.0"]
  pull_request:
    branches: ["5.0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Spigot 26.1 via BuildTools
        uses: SpraxDev/Action-SpigotMC@v5
        with:
          versions: 26.1
          generateSrc: false
          remapped: false

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LightAPI-Reborn-jar
          path: plugin/target/*.jar
          if-no-files-found: warn
